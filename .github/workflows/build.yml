name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytclip-hub-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-${{ github.run_number }}
          name: ytclip-hub v0.1.0.${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/**/*.apk
          generate_release_notes: false
          body: |
            ## ytclip-hub Experimental
            
            ### Download
            - **arm64-v8a** — Most modern phones
            - **universal** — All phones
            
            ### What's New
            - Manga reader
            - Manhwa reader
            - Novel support
            - Extension system for additional sources
